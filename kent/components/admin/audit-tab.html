<!-- Audit Logs Tab -->
<div id="audit-tab" class="hidden">
    <div class="section-card">
        <div class="section-header">
            <div class="section-title">
                <h2>Audit Logs</h2>
                <p>Track all system activities and user actions</p>
            </div>
            <button class="btn-primary" onclick="exportAuditLogs()">
                <i data-lucide="download"></i>
                <span>Export Logs</span>
            </button>
        </div>

        <div class="filters">
            <div class="search-input">
                <i data-lucide="search"></i>
                <input type="text" id="auditSearch" placeholder="Search logs..." oninput="filterAuditLogs()">
            </div>
            <select id="moduleFilter" onchange="filterAuditLogs()">
                <option value="all">All Modules</option>
                <option value="Patient Records">Patient Records</option>
                <option value="Appointments">Appointments</option>
                <option value="User Management">User Management</option>
                <option value="Eye Examination">Eye Examination</option>
                <option value="Sales & Billing">Sales & Billing</option>
                <option value="Inventory">Inventory</option>
                <option value="Reports">Reports</option>
                <option value="System">System</option>
            </select>
            <input type="date" id="dateFrom" onchange="filterAuditLogs()">
            <input type="date" id="dateTo" onchange="filterAuditLogs()">
        </div>
    </div>

    <div class="table-container">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Action</th>
                        <th>Module</th>
                        <th>Details</th>
                        <th>Timestamp</th>
                        <th>IP Address</th>
                    </tr>
                </thead>
                <tbody id="auditTableBody">
                </tbody>
            </table>
        </div>
        <div id="auditEmptyState" class="empty-state hidden">
            <i data-lucide="activity"></i>
            <p>No audit logs found</p>
            <p>Try adjusting your search or filter criteria</p>
        </div>
    </div>
</div>
