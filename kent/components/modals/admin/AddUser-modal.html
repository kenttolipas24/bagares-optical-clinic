<!-- Add User Modal -->
<div id="addUserModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Add New User</h3>
            <button class="close-btn" onclick="closeAddUserModal()">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Full Name *</label>
                <input type="text" id="addName" class="form-input" placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label class="form-label">Username *</label>
                <input type="text" id="addUsername" class="form-input" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label class="form-label">Email Address *</label>
                <input type="email" id="addEmail" class="form-input" placeholder="Enter email address">
            </div>
            <div class="form-group">
                <label class="form-label">Role *</label>
                <select id="addRole" class="form-input">
                    <option value="Admin">Admin</option>
                    <option value="Staff">Staff</option>
                    <option value="Receptionist">Receptionist</option>
                    <option value="Optometrist">Optometrist</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Password *</label>
                <input type="password" id="addPassword" class="form-input" placeholder="Enter password">
            </div>
            <div class="form-group">
                <label class="form-label">Confirm Password *</label>
                <input type="password" id="addConfirmPassword" class="form-input" placeholder="Confirm password">
                <p id="passwordError" class="error-text hidden">Passwords do not match</p>
            </div>
            <div class="form-group">
                <label class="form-label">Status</label>
                <select id="addStatus" class="form-input">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeAddUserModal()">Cancel</button>
            <button class="btn-primary" id="addUserBtn" onclick="addUser()">Add User</button>
        </div>
    </div>
</div>
