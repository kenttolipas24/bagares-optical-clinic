<header class="header">
  <!-- Background overlay -->
  <div class="header-background"></div>

  <!-- Main header container -->
  <div class="header-container">
    <!-- Logo + Clinic name -->
    <div class="logo-section">
      <div class="logo">
        <img src="../assets/picture/logo.jpg" alt="Logo">
      </div>
      <span class="clinic-name">Bagares Optical Clinic</span>
    </div>

    <!-- Navigation links -->
    <nav class="navigation">
      <div class="nav-dropdown">
        <button class="nav-button" onclick="toggleDropdown('inventory')">
          <span id="inventoryDropdownText">Inventory</span>
          <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <div class="dropdown-menu" id="inventory-dropdown">
          <a href="#" class="dropdown-item" onclick="changePage('inventory', event)">Inventory</a>
          <a href="#" class="dropdown-item" onclick="changePage('condemnation', event)">Condemnation</a>
          <a href="#" class="dropdown-item" onclick="changePage('purchase', event)">Purchase Orders</a>
          <a href="#" class="dropdown-item" onclick="changePage('supplier', event)">Suppliers</a>
        </div>
      </div>
      <!-- <button class="nav-button" onclick="ChangePage('sales-billing', event)">Sales & Billing</button> -->
      <button class="nav-button" onclick="changePage('reports', event)">Reports</button>
    </nav>

    <!-- Icons: Notification + Profile -->
    <div class="icons-section">
      <!-- Notification button -->
      <button class="icon-button" onclick="handleNotification()">
        <img src="https://cdn.iconsax.io/icons/free/rounded/notifications/twotone/notification_alert-message-update-reminder-bell-temp.webp" alt="Notification Icon" class="icon-img">
        <span class="notification-badge"></span>
      </button>

      <!-- Profile button -->
      <button class="icon-button profile-btn">
        <svg class="profile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>
    </div>
  </div>
</header>
